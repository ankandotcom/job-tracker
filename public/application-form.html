<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackMyJobs — Add Application</title>
  <link rel="stylesheet" href="/css/app.css">
</head>

<body>
  <div class="page">
    <div class="container" style="max-width:720px">
      <h1 style="font-size:20px;font-weight:600;margin-bottom:1.5rem" id="page-title">Add application</h1>

      <!-- ── JD Auto-fill panel ───────────────────────────────────────── -->
      <div class="card" style="margin-bottom:1.25rem;border:1px solid #AFA9EC;background:#EEEDFE">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.75rem">
          <div>
            <div style="font-weight:600;font-size:14px;color:#3C3489">JD auto-fill</div>
            <div class="text-sm" style="color:#534AB7;margin-top:2px">Paste a job description — AI fills the form for
              you</div>
          </div>
          <button type="button" id="toggle-jd-btn" class="btn btn-sm" style="background:#534AB7;color:#EEEDFE">Paste
            JD</button>
        </div>
        <div id="jd-panel" style="display:none">
          <textarea id="jd-text" rows="6" placeholder="Paste the full job description here…"
            style="margin-bottom:.75rem;background:#fff"></textarea>
          <div style="display:flex;gap:.5rem;align-items:center">
            <button type="button" id="jd-btn" class="btn btn-sm" style="background:#534AB7;color:#EEEDFE">Extract
              fields</button>
            <span id="jd-status" class="text-sm" style="color:#534AB7"></span>
          </div>
        </div>
      </div>

      <!-- ── Application form ─────────────────────────────────────────── -->
      <div class="card">
        <form id="app-form" style="display:flex;flex-direction:column;gap:1rem">
          <div class="form-row">
            <div class="form-group">
              <label>Company *</label>
              <input type="text" id="f-company" required placeholder="Acme Corp">
            </div>
            <div class="form-group">
              <label>Role *</label>
              <input type="text" id="f-role" required placeholder="Senior Engineer">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Salary range</label>
              <input type="text" id="f-salary" placeholder="£80,000–£100,000">
            </div>
            <div class="form-group">
              <label>Status</label>
              <select id="f-status">
                <option value="applied">Applied</option>
                <option value="screening">Screening</option>
                <option value="interview">Interview</option>
                <option value="offer">Offer</option>
                <option value="rejected">Rejected</option>
                <option value="withdrawn">Withdrawn</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Job URL</label>
            <input type="url" id="f-url" placeholder="https://...">
          </div>
          <div class="form-group">
            <label>Notes</label>
            <textarea id="f-notes" rows="4" placeholder="Key skills required, interview notes, contacts…"></textarea>
          </div>
          <div id="form-error" class="form-error" style="display:none"></div>
          <div style="display:flex;gap:.75rem">
            <button class="btn btn-primary" type="submit" id="submit-btn">Save application</button>
            <a href="/applications.html" class="btn btn-ghost">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/application-form.js"></script>
</body>

</html>
