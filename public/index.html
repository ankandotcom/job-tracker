<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackMyJobs</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="./img/TrackMyJobs1.png">
</head>
<body>
<div class="auth-page">
  <div class="auth-card card">
    
    <div class="auth-logo" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
      <svg xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--purple);" aria-hidden="true">
        <rect x="3" y="1.5" width="18" height="21" rx="2" ry="2"/>
        <line x1="8" y1="6.5" x2="16" y2="6.5"/>
        <line x1="8" y1="11.5" x2="16" y2="11.5"/>
        <polyline points="9 16.5 12 19.5 15 16.5"/>
      </svg>
      <span>TrackMyJobs</span>
    </div>

    <div style="display:flex;gap:.5rem;margin-bottom:1.5rem">
      <button id="tab-login" style="flex:1" class="btn btn-primary">Sign in</button>
      <button id="tab-reg"   style="flex:1" class="btn btn-ghost">Register</button>
    </div>

    <form id="form-login" style="display:flex;flex-direction:column;gap:1rem">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" required placeholder="••••••••">
      </div>
      <div id="login-error" class="form-error" style="display:none"></div>
      <button type="submit" id="login-btn" class="btn btn-primary">Sign in</button>
    </form>

    <form id="form-register" style="display:none;flex-direction:column;gap:1rem">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="reg-name" required placeholder="Your name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password <span class="text-muted">(min 8 characters)</span></label>
        <input type="password" id="reg-password" required placeholder="••••••••" minlength="8">
      </div>
      <div id="reg-error" class="form-error" style="display:none"></div>
      <button type="submit" id="reg-btn" class="btn btn-primary">Create account</button>
    </form>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
