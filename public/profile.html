<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackMyJobs — Profile</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="./img/TrackMyJobs1.png">
</head>
<body>
<div class="page">
  <div class="container" style="max-width:680px">
    <h1 style="font-size:20px;font-weight:600;margin-bottom:1.5rem">Profile</h1>

    <!-- Account details -->
    <div class="card" style="margin-bottom:1.25rem">
      <div style="font-weight:600;margin-bottom:1rem">Account details</div>
      <form id="form-profile" style="display:flex;flex-direction:column;gap:1rem">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="p-name" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="p-email" disabled style="opacity:.6;cursor:not-allowed">
        </div>
        <div id="profile-msg" style="display:none;font-size:12px"></div>
        <button class="btn btn-primary" style="align-self:flex-start" type="submit" id="profile-btn">Save changes</button>
      </form>
    </div>

    <!-- Resume -->
    <div class="card">
      <div style="font-weight:600;margin-bottom:.25rem">Resume text</div>
      <div class="text-sm text-muted" style="margin-bottom:1rem">
        Used by the <strong>Resume gap analyser</strong> to compare your experience against job descriptions.
        Paste the plain-text content of your CV — no formatting needed.
      </div>
      <form id="form-resume" style="display:flex;flex-direction:column;gap:1rem">
        <div class="form-group">
          <textarea id="p-resume" rows="14"
            placeholder="Paste your resume here…&#10;&#10;Experience&#10;Senior Engineer — Acme Corp (2021–present)&#10;• Built REST APIs serving 2M req/day using Node.js and PostgreSQL&#10;• Led migration from monolith to microservices&#10;&#10;Skills: TypeScript, React, Node.js, PostgreSQL, AWS, Docker"></textarea>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div id="resume-msg" style="display:none;font-size:12px"></div>
            <div id="resume-char" class="text-sm text-muted"></div>
          </div>
          <button class="btn btn-primary" type="submit" id="resume-btn">Save resume</button>
        </div>
      </form>
    </div>

  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
